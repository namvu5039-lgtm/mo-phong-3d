<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS 3D PRO - Interactive Engineering & Photorealistic CAD Visualizer</title>
    
    <!-- Tailwind CSS, Fonts & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Engine & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #030712;
            color: #f3f4f6;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-code { font-family: 'Fira Code', monospace; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8);
        }
        
        .glass-button {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease-in-out;
        }
        
        .glass-button:hover {
            background: rgba(14, 165, 233, 0.3);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 18px rgba(14, 165, 233, 0.4);
        }

        /* 3D Pin Indicator Callouts */
        .annotation-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .annotation-pin:hover {
            transform: translate(-50%, -50%) scale(1.15);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); }
        ::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 6px; }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden select-none bg-slate-950">

    <!-- 3D WebGL Canvas Render Target Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Dynamic 3D Spatial Hotspot Overlay Canvas Layer -->
    <div id="hotspot-container" class="absolute inset-0 z-10 pointer-events-none overflow-hidden"></div>

    <!-- Top Cyberpunk Dashboard Navigation Header -->
    <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-4 pointer-events-none">
        <div class="flex items-center gap-3 glass-panel px-4 py-2.5 rounded-2xl pointer-events-auto">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/40">
                <i class="fa-solid fa-cube text-xl animate-pulse"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold text-sm tracking-wider text-cyan-400">NEXUS <span class="text-white">3D REALISM</span></h1>
                <p class="text-[10px] text-slate-400 font-code uppercase tracking-widest">High-Fidelity CAD & Physical Visualizer</p>
            </div>
        </div>

        <!-- Model Selection Dropdown & Quick Search -->
        <div class="flex items-center gap-3 glass-panel p-2 rounded-2xl pointer-events-auto max-w-md w-full sm:w-auto">
            <div class="relative flex-1 sm:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input id="search-input" type="text" placeholder="Tìm thiết bị điện tử, cơ khí..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-8 pr-8 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                <button onclick="clearSearch()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <select id="model-select" class="bg-slate-900 border border-slate-700 text-cyan-300 text-xs font-semibold rounded-xl px-3 py-1.5 focus:outline-none focus:border-cyan-500 cursor-pointer">
                <optgroup label="⚡ ĐIỆN GIA DỤNG CHÂN THỰC">
                    <option value="kettle">🍵 Ấm Đun Siêu Tốc (Electric Kettle Pro)</option>
                    <option value="fan">🌀 Quạt Động Cơ Cuộn Đồng (Desk Fan)</option>
                    <option value="fridge">❄️ Tủ Lạnh Inverter Mặt Thép (Refrigerator)</option>
                    <option value="ac">🌡️ Điều Hòa 2 Dàn Tản Nhiệt (Split AC)</option>
                    <option value="led">💡 Đèn LED Búp Smart RGB (LED Bulb)</option>
                </optgroup>
                <optgroup label="💻 ĐIỆN TỬ & MÁY TÍNH HIGH-END">
                    <option value="pc">🖥️ PC Gaming Card Đồ Họa 3 Fan (Gaming PC)</option>
                    <option value="laptop">💻 Laptop Dual Heatpipe OLED (Laptop)</option>
                    <option value="phone">📱 Smartphone Khung Titanium (Flagship Phone)</option>
                    <option value="smartwatch">⌚ Đồng Hồ Sapphire Smartwatch (Smartwatch)</option>
                    <option value="keyboard">⌨️ Switch Bàn Phím Cơ (Mechanical Switch)</option>
                    <option value="hdd">💾 Ổ Cứng Cơ Từ Tính (HDD Drive)</option>
                </optgroup>
                <optgroup label="🏎️ CƠ KHÍ & THIẾT BỊ NĂNG LƯỢNG">
                    <option value="car">🏎️ Siêu Xe Điện EV Dual Motor (EV Supercar)</option>
                    <option value="motorbike">🛵 Xe Máy Tay Ga 150cc (Motorbike)</option>
                    <option value="tractor">🚜 Máy Cày Heavy Diesel (Tractor)</option>
                    <option value="elevator">🛗 Thang Máy Kính Quan Sát (Glass Elevator)</option>
                    <option value="jetengine">✈️ Động Cơ Phản Lực Turbofan (Jet Engine)</option>
                    <option value="drone">🚁 Flycam Drone 4 Cánh (Quadcopter)</option>
                    <option value="drill">🛠️ Máy Khoan Cầm Tay 13mm (Power Drill)</option>
                    <option value="breaker">⚡ Aptomat Cầu Dao Ngắt Mạch (Circuit Breaker)</option>
                    <option value="shoe">👟 Giày Techwear Auto-Lace (Cyber Sneaker)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <!-- Floating Interactive Control Toolbar -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-4xl glass-panel p-4 rounded-3xl shadow-2xl flex flex-col lg:flex-row items-center justify-between gap-4">
        <!-- Explode Assembly Slider -->
        <div class="flex items-center gap-3 w-full lg:w-auto flex-1">
            <div class="flex items-center gap-2 text-cyan-400 font-orbitron text-xs whitespace-nowrap">
                <i class="fa-solid fa-burst text-sm"></i>
                <span>TÁCH BỘ PHẬN:</span>
                <span id="explode-val-text" class="text-white font-code w-10">0%</span>
            </div>
            <input id="explode-slider" type="range" min="0" max="100" value="0" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
            <div class="flex gap-1">
                <button onclick="setExplode(0)" class="px-2.5 py-1 text-[10px] font-code bg-slate-800 hover:bg-cyan-900/50 text-slate-300 rounded-lg border border-slate-700">0%</button>
                <button onclick="setExplode(50)" class="px-2.5 py-1 text-[10px] font-code bg-slate-800 hover:bg-cyan-900/50 text-slate-300 rounded-lg border border-slate-700">50%</button>
                <button onclick="setExplode(100)" class="px-2.5 py-1 text-[10px] font-code bg-slate-800 hover:bg-cyan-900/50 text-slate-300 rounded-lg border border-slate-700">100%</button>
            </div>
        </div>

        <!-- Render Modes & Simulation Controls -->
        <div class="flex items-center gap-2 w-full lg:w-auto justify-end flex-wrap">
            <!-- Studio Preset Select -->
            <select id="lighting-preset" onchange="changeLightingPreset(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-amber-300 font-medium rounded-xl px-2.5 py-2 focus:outline-none cursor-pointer">
                <option value="studio">💡 Studio Chân Thực</option>
                <option value="cyber">🌃 Cyber Neon</option>
                <option value="blueprint">📐 Bản Vẽ Blueprint</option>
            </select>

            <button id="btn-reset" onclick="resetPartPositions()" class="glass-button px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-slate-200 hover:text-cyan-300 transition-colors" title="Đặt tất cả bộ phận về vị trí ban đầu">
                <i class="fa-solid fa-rotate-left text-amber-400"></i>
                <span>Đặt Lại Vị Trí</span>
            </button>

            <button id="btn-xray" onclick="toggleXRayMode()" class="glass-button px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-slate-200">
                <i class="fa-solid fa-bone text-cyan-400"></i>
                <span id="xray-label">X-Ray Thấu Kính</span>
            </button>

            <button id="btn-sim" onclick="toggleOperationSim()" class="glass-button px-3 py-2 rounded-xl text-xs flex items-center gap-2 text-slate-200">
                <i id="sim-icon" class="fa-solid fa-play text-emerald-400"></i>
                <span id="sim-label">Vận Hành Thực Tế</span>
            </button>

            <button id="btn-audio" onclick="toggleAudio()" class="glass-button px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 text-slate-200">
                <i id="audio-icon" class="fa-solid fa-volume-xmark text-amber-400"></i>
            </button>
        </div>
    </div>

    <!-- Sliding Part Engineering Detail Panel -->
    <aside id="part-detail-panel" class="absolute top-20 right-4 bottom-28 z-20 w-80 sm:w-96 glass-panel rounded-3xl p-5 shadow-2xl transition-transform duration-300 transform translate-x-[120%] flex flex-col justify-between overflow-y-auto">
        <div>
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                <div class="flex items-center gap-2 text-cyan-400 font-orbitron text-xs tracking-wider">
                    <i class="fa-solid fa-microchip text-base"></i>
                    <span>THÔNG SỐ KỸ THUẬT CHI TIẾT</span>
                </div>
                <button onclick="closePartDetail()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <h3 id="part-name-vi" class="text-base font-bold text-white mb-1">Tên linh kiện tiếng Việt</h3>
            <p id="part-name-en" class="text-xs font-code text-cyan-400 mb-3">Component English Name</p>

            <div class="mb-4">
                <span class="text-[10px] font-code text-slate-400 uppercase tracking-widest block mb-1">VẬT LIỆU & TIÊU CHUẨN:</span>
                <span id="part-material-spec" class="inline-block px-3 py-1 bg-cyan-950/90 text-cyan-300 border border-cyan-800/80 rounded-lg text-xs font-medium shadow-inner">Thông số vật liệu</span>
            </div>

            <div>
                <span class="text-[10px] font-code text-slate-400 uppercase tracking-widest block mb-1">NGUYÊN LÝ HOẠT ĐỘNG & VẬT LÝ:</span>
                <div id="part-description" class="text-xs text-slate-300 leading-relaxed font-sans bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                    Mô tả chức năng kỹ thuật chi tiết của bộ phận.
                </div>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800 flex gap-2">
            <button onclick="focusOnPart()" class="w-full glass-button py-2.5 rounded-xl text-xs font-semibold text-cyan-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-crosshairs"></i>
                <span>Tập Trung Cảm Biến Camera 3D</span>
            </button>
        </div>
    </aside>

    <script>
        let scene, camera, renderer, controls;
        let currentModelGroup = null;
        let interactiveParts = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // 3D Interactive Drag & Drop Variables
        let isDraggingPart = false;
        let draggedPart = null;
        let pointerDownPos = new THREE.Vector2();
        let dragPlane = new THREE.Plane();
        let planeNormal = new THREE.Vector3();
        let dragIntersection = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();

        let explosionRate = 0;
        let isXRayMode = false;
        let isSimulationRunning = false;
        let isAudioMuted = true;
        let audioCtx = null;
        let activeSoundNodes = [];

        // Dynamic Procedural Canvas Textures
        let pbrTextures = {};

        // Studio Lights Reference
        let keyLight, fillLight, rimLight, ambientLight;

        // ---------------------------------------------------------------------
        // PROCEDURAL REALISTIC TEXTURE GENERATORS (Brushed Metal, PCB, Carbon)
        // ---------------------------------------------------------------------
        function generateProceduralTextures() {
            // 1. Brushed Stainless Steel Texture
            const canvasMetal = document.createElement('canvas');
            canvasMetal.width = 512; canvasMetal.height = 512;
            const ctxM = canvasMetal.getContext('2d');
            ctxM.fillStyle = '#b0b7c0'; ctxM.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 20000; i++) {
                ctxM.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
                ctxM.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 80 + 20, 1);
            }
            pbrTextures.brushedMetal = new THREE.CanvasTexture(canvasMetal);
            pbrTextures.brushedMetal.wrapS = THREE.RepeatWrapping;
            pbrTextures.brushedMetal.wrapT = THREE.RepeatWrapping;
            pbrTextures.brushedMetal.repeat.set(2, 2);

            // 2. High-Tech Green PCB Circuit Board Texture
            const canvasPcb = document.createElement('canvas');
            canvasPcb.width = 512; canvasPcb.height = 512;
            const ctxP = canvasPcb.getContext('2d');
            ctxP.fillStyle = '#064e3b'; ctxP.fillRect(0, 0, 512, 512);
            ctxP.strokeStyle = '#10b981'; ctxP.lineWidth = 2;
            for (let i = 0; i < 60; i++) {
                ctxP.beginPath();
                let x = Math.random() * 512, y = Math.random() * 512;
                ctxP.moveTo(x, y);
                for (let j = 0; j < 3; j++) {
                    x += (Math.random() - 0.5) * 80;
                    y += (Math.random() - 0.5) * 80;
                    ctxP.lineTo(x, y);
                }
                ctxP.stroke();
                ctxP.fillStyle = '#f59e0b';
                ctxP.fillRect(x - 3, y - 3, 6, 6);
            }
            pbrTextures.pcbBoard = new THREE.CanvasTexture(canvasPcb);

            // 3. Carbon Fiber Weave Texture
            const canvasCarbon = document.createElement('canvas');
            canvasCarbon.width = 128; canvasCarbon.height = 128;
            const ctxC = canvasCarbon.getContext('2d');
            ctxC.fillStyle = '#111827'; ctxC.fillRect(0, 0, 128, 128);
            for (let x = 0; x < 128; x += 16) {
                for (let y = 0; y < 128; y += 16) {
                    ctxC.fillStyle = ((x + y) % 32 === 0) ? '#374151' : '#1f2937';
                    ctxC.fillRect(x, y, 14, 14);
                }
            }
            pbrTextures.carbonFiber = new THREE.CanvasTexture(canvasCarbon);
            pbrTextures.carbonFiber.wrapS = THREE.RepeatWrapping;
            pbrTextures.carbonFiber.wrapT = THREE.RepeatWrapping;
            pbrTextures.carbonFiber.repeat.set(8, 8);

            // 4. Dynamic Digital Display Texture
            pbrTextures.digitalDisplayCanvas = document.createElement('canvas');
            pbrTextures.digitalDisplayCanvas.width = 256;
            pbrTextures.digitalDisplayCanvas.height = 128;
            pbrTextures.digitalDisplayCtx = pbrTextures.digitalDisplayCanvas.getContext('2d');
            pbrTextures.digitalDisplayTexture = new THREE.CanvasTexture(pbrTextures.digitalDisplayCanvas);
            updateDisplayTexture("NEXUS OS", "98.5 °C / READY");
        }

        function updateDisplayTexture(title, status) {
            const ctx = pbrTextures.digitalDisplayCtx;
            ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, 256, 128);
            ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 4; ctx.strokeRect(4, 4, 248, 120);
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 20px Orbitron, sans-serif';
            ctx.fillText(title, 20, 45);
            ctx.fillStyle = '#10b981'; ctx.font = 'bold 18px Fira Code, monospace';
            ctx.fillText(status, 20, 85);
            ctx.fillStyle = '#f59e0b'; ctx.fillRect(20, 100, 216, 6);
            if (pbrTextures.digitalDisplayTexture) pbrTextures.digitalDisplayTexture.needsUpdate = true;
        }

        // ---------------------------------------------------------------------
        // HIGH-FIDELITY BILINGUAL MODEL DATABASE
        // ---------------------------------------------------------------------
        const MODELS_DATABASE = {
            kettle: { id: 'kettle', nameVi: "Ấm Đun Siêu Tốc Inox 304 Cao Cấp", nameEn: "Pro SUS304 Industrial Electric Kettle", builder: createElectricKettle },
            fan: { id: 'fan', nameVi: "Quạt Bàn Động Cơ Đồng Nan Sắt", nameEn: "Desk Fan with Copper Stator & Wire Cage", builder: createElectricFan },
            fridge: { id: 'fridge', nameVi: "Tủ Lạnh Inverter Thép Xước 2 Cánh", nameEn: "Brushed Steel Inverter Smart Refrigerator", builder: createRefrigerator },
            ac: { id: 'ac', nameVi: "Máy Lạnh 2 Cục Dàn Đồng Tản Nhiệt", nameEn: "Dual-Unit Split Air Conditioner", builder: createAirConditioner },
            led: { id: 'led', nameVi: "Đèn LED Búp Nhôm Tản Nhiệt Smart RGB", nameEn: "Smart Aluminum Heat-Sink LED Bulb", builder: createLedBulb },
            pc: { id: 'pc', nameVi: "Máy Tính Bàn Gaming RTX 4090 3 Fan", nameEn: "High-End Gaming PC & RTX 4090 GPU", builder: createDesktopPC },
            laptop: { id: 'laptop', nameVi: "Laptop OLED Dual Fan Heatpipe", nameEn: "High-Performance OLED Laptop", builder: createLaptop },
            phone: { id: 'phone', nameVi: "Smartphone Khung Titanium Ba Cam", nameEn: "Grade-5 Titanium Flagship Smartphone", builder: createSmartphone },
            smartwatch: { id: 'smartwatch', nameVi: "Đồng Hồ Smartwatch Mặt Sapphire", nameEn: "Sapphire Crystal Cyber Smartwatch", builder: createCyberSmartwatch },
            keyboard: { id: 'keyboard', nameVi: "Công Tắc Phím Cơ Switch Chống Nước", nameEn: "RGB Mechanical Keyboard Switch", builder: createMechanicalSwitch },
            hdd: { id: 'hdd', nameVi: "Ổ Cứng Từ Tính HDD Mặt Gương", nameEn: "High-Speed Magnetic HDD Drive", builder: createHardDiskDrive },
            car: { id: 'car', nameVi: "Siêu Xe Điện EV Thân Sợi Carbon", nameEn: "Aero Carbon Fiber EV Supercar", builder: createElectricCar },
            motorbike: { id: 'motorbike', nameVi: "Xe Máy Tay Ga 150cc Phanh ABS", nameEn: "150cc Scooter Motorbike with ABS", builder: createMotorbike },
            tractor: { id: 'tractor', nameVi: "Máy Cày Nông Nghiệp Turbo Diesel", nameEn: "Heavy Agricultural Diesel Tractor", builder: createTractor },
            elevator: { id: 'elevator', nameVi: "Thang Máy Kính Quan Sát Cáp Kéo", nameEn: "Panoramic Glass Elevator System", builder: createElevator },
            jetengine: { id: 'jetengine', nameVi: "Động Cơ Phản Lực Turbofan Cánh Cong", nameEn: "High-Bypass Turbofan Jet Engine", builder: createJetEngine },
            drone: { id: 'drone', nameVi: "Flycam Drone Sợi Carbon 4 Động Cơ", nameEn: "Carbon-Fiber Quadcopter Drone", builder: createQuadcopterDrone },
            drill: { id: 'drill', nameVi: "Máy Khoan Cầm Tay Đầu Mang Rí Thép", nameEn: "Power Hand Drill with Steel Chuck", builder: createPowerDrill },
            breaker: { id: 'breaker', nameVi: "Aptomat Cầu Dao Ngắt Mạch Tự Động", nameEn: "Modular Circuit Breaker (RCCB/MCB)", builder: createCircuitBreaker },
            shoe: { id: 'shoe', nameVi: "Giày Techwear Tự Thắt Dây Auto-Lace", nameEn: "Techwear Self-Lacing Cyber Sneaker", builder: createSelfLacingShoe }
        };

        // ---------------------------------------------------------------------
        // REALISTIC MODEL BUILDER IMPLEMENTATIONS
        // ---------------------------------------------------------------------

        function createElectricKettle() {
            const group = new THREE.Group();
            interactiveParts = [];

            // PBR Materials
            const steelMat = new THREE.MeshStandardMaterial({
                color: 0xe2e8f0, metalness: 0.95, roughness: 0.15, map: pbrTextures.brushedMetal
            });
            const plasticMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35 });
            const heatingCoilMat = new THREE.MeshStandardMaterial({ color: 0xb45309, metalness: 0.9, roughness: 0.2 });
            const glassWaterMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, transmission: 0.85, roughness: 0.05 });

            // 1. Strix Base & Copper Connector
            const baseGrp = new THREE.Group();
            const baseRing = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.25, 0.22, 48), plasticMat);
            baseRing.castShadow = true; baseRing.receiveShadow = true;
            const pinConn = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.25, 24), heatingCoilMat);
            pinConn.position.y = 0.15;
            baseGrp.add(baseRing, pinConn);
            baseGrp.userData = {
                id: "kettle_base", nameEn: "360-Degree Strix Thermostat Power Base", nameVi: "Đế Cấp Điện 360° & Bộ Cảm Biến Strix Anh Quốc",
                spec: "Công suất 2200W - Chân tiếp xúc đồng nguyên chất 99.9%", desc: "Chứa bộ rơ-le nhiệt tự động ngắt điện khi nước đạt 100°C hoặc khi ấm cạn nước.",
                explodeOffset: new THREE.Vector3(0, -1.8, 0)
            };
            baseGrp.position.set(0, -1.2, 0);
            group.add(baseGrp); interactiveParts.push(baseGrp);

            // 2. SUS304 Stainless Steel Pitcher Body with Heating Coil & Glass Gauge
            const bodyGrp = new THREE.Group();
            const bodyOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.05, 1.8, 48), steelMat);
            bodyOuter.castShadow = true; bodyOuter.receiveShadow = true;

            // Internal Heating Element Coil Inside Bottom
            const coil = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.06, 16, 32), heatingCoilMat);
            coil.rotation.x = Math.PI / 2;
            coil.position.y = -0.75;
            bodyOuter.add(coil);

            // Transparent Water Level Gauge Window
            const gauge = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.15), glassWaterMat);
            gauge.position.set(0.92, 0, 0);
            bodyOuter.add(gauge);

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.04);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.2, 2.2, 4.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 18;
            controls.minDistance = 1.2;

            // Setup Studio Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(6, 12, 8);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);

            fillLight = new THREE.DirectionalLight(0x38bdf8, 1.0);
            fillLight.position.set(-6, 4, -6);
            scene.add(fillLight);

            rimLight = new THREE.DirectionalLight(0xf59e0b, 0.8);
            rimLight.position.set(0, -6, -6);
            scene.add(rimLight);

            // Shadow Floor Plane
            const shadowFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.ShadowMaterial({ opacity: 0.35 })
            );
            shadowFloor.rotation.x = -Math.PI / 2;
            shadowFloor.position.y = -1.6;
            shadowFloor.receiveShadow = true;
            scene.add(shadowFloor);

            // Grid
            const gridHelper = new THREE.GridHelper(20, 40, 0x0284c7, 0x1e293b);
            gridHelper.position.y = -1.61;
            scene.add(gridHelper);

            // Generate Procedural Textures
            generateProceduralTextures();

            // Event Listeners for 3D Drag & Drop and Camera Orbiting
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            // Load Default Model
            loadSelectedModel('kettle');
            animate();
        }

        // Web Audio Procedural Synthesizer for Motor/Fan Sounds
        function toggleAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            isAudioMuted = !isAudioMuted;
            const btnIcon = document.getElementById('audio-icon');

            if (!isAudioMuted) {
                btnIcon.className = "fa-solid fa-volume-high text-emerald-400";
                playClickSound();
                if (isSimulationRunning) startMotorAudio();
            } else {
                btnIcon.className = "fa-solid fa-volume-xmark text-amber-400";
                stopMotorAudio();
            }
        }

        function playClickSound() {
            if (isAudioMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function startMotorAudio() {
            if (isAudioMuted || !audioCtx) return;
            stopMotorAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            activeSoundNodes.push(osc);
        }

        function stopMotorAudio() {
            activeSoundNodes.forEach(node => { try { node.stop(); } catch(e){} });
            activeSoundNodes = [];
        }

        function changeLightingPreset(preset) {
            playClickSound();
            if (preset === 'studio') {
                keyLight.color.setHex(0xffffff); keyLight.intensity = 1.8;
                fillLight.color.setHex(0x38bdf8);
                scene.fog.color.setHex(0x030712);
            } else if (preset === 'cyber') {
                keyLight.color.setHex(0x00f0ff); keyLight.intensity = 2.2;
                fillLight.color.setHex(0xff007f);
                scene.fog.color.setHex(0x0a0015);
            } else if (preset === 'blueprint') {
                keyLight.color.setHex(0x38bdf8); keyLight.intensity = 1.5;
                fillLight.color.setHex(0x0284c7);
                scene.fog.color.setHex(0x021526);
            }
        }

        function loadSelectedModel(modelKey) {
            playClickSound();
            if (!MODELS_DATABASE[modelKey]) return;

            if (currentModelGroup) scene.remove(currentModelGroup);

            const modelData = MODELS_DATABASE[modelKey];
            currentModelGroup = modelData.builder();
            scene.add(currentModelGroup);

            // Record original base positions
            currentModelGroup.traverse(child => {
                if (child.userData && child.userData.explodeOffset) {
                    child.userData.basePos = child.position.clone();
                }
            });

            document.getElementById('explode-slider').value = 0;
            document.getElementById('explode-val-text').innerText = "0%";
            explosionRate = 0;

            if (isXRayMode) applyXRayState();
            closePartDetail();
        }

        function updateExplosion(val) {
            explosionRate = val;
            document.getElementById('explode-val-text').innerText = `${Math.round(val * 100)}%`;
            interactiveParts.forEach(part => {
                if (part.userData && part.userData.explodeOffset && part.userData.basePos) {
                    const targetPos = part.userData.basePos.clone().add(
                        part.userData.explodeOffset.clone().multiplyScalar(val)
                    );
                    new TWEEN.Tween(part.position)
                        .to(targetPos, 200)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();
                }
            });
        }

        function setExplode(val) {
            const slider = document.getElementById('explode-slider');
            slider.value = val;
            updateExplosion(val / 100);
        }

        function toggleXRayMode() {
            playClickSound();
            isXRayMode = !isXRayMode;
            const label = document.getElementById('xray-label');
            label.innerText = isXRayMode ? "Chế Độ Thường" : "X-Ray Thấu Kính";
            applyXRayState();
        }

        function applyXRayState() {
            if (!currentModelGroup) return;
            currentModelGroup.traverse(child => {
                if (child.isMesh) {
                    if (!child.userData.origMaterial) {
                        child.userData.origMaterial = child.material;
                    }
                    if (isXRayMode) {
                        child.material = new THREE.MeshPhysicalMaterial({
                            color: 0x0284c7,
                            wireframe: true,
                            transparent: true,
                            opacity: 0.4
                        });
                    } else {
                        child.material = child.userData.origMaterial;
                    }
                }
            });
        }

        function toggleOperationSim() {
            playClickSound();
            isSimulationRunning = !isSimulationRunning;
            const simLabel = document.getElementById('sim-label');
            const simIcon = document.getElementById('sim-icon');
            if (isSimulationRunning) {
                simLabel.innerText = "Dừng Vận Hành";
                simIcon.className = "fa-solid fa-pause text-amber-400";
                if (!isAudioMuted) startMotorAudio();
            } else {
                simLabel.innerText = "Vận Hành Thực Tế";
                simIcon.className = "fa-solid fa-play text-emerald-400";
                stopMotorAudio();
            }
        }

        // ---------------------------------------------------------------------
        // 3D PART DRAG & DROP AND SELECTION LOGIC
        // ---------------------------------------------------------------------
        function onPointerDown(event) {
            // Prevent drag trigger when clicking on HUD / UI Overlay elements
            if (event.clientY < 80 || event.clientY > window.innerHeight - 100 || event.clientX > window.innerWidth - 300) return;

            pointerDownPos.set(event.clientX, event.clientY);
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveParts, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && !hitObj.userData.id && hitObj.parent !== currentModelGroup) {
                    hitObj = hitObj.parent;
                }
                if (hitObj.userData && hitObj.userData.nameVi) {
                    draggedPart = hitObj;

                    // Orient drag plane facing the camera, passing through object's position
                    camera.getWorldDirection(planeNormal).negate();
                    dragPlane.setFromNormalAndCoplanarPoint(planeNormal, draggedPart.position);

                    // Offset calculation to avoid snapping object center to cursor
                    if (raycaster.ray.intersectPlane(dragPlane, dragIntersection)) {
                        dragOffset.copy(draggedPart.position).sub(dragIntersection);
                    }
                }
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (draggedPart) {
                const distMoved = pointerDownPos.distanceTo(new THREE.Vector2(event.clientX, event.clientY));
                if (distMoved > 6) {
                    if (!isDraggingPart) {
                        isDraggingPart = true;
                        controls.enabled = false; // Disable orbit control while dragging part
                        document.body.style.cursor = 'grabbing';
                    }

                    raycaster.setFromCamera(mouse, camera);
                    if (raycaster.ray.intersectPlane(dragPlane, dragIntersection)) {
                        draggedPart.position.copy(dragIntersection.add(dragOffset));
                    }
                }
            }
        }

        function onPointerUp(event) {
            if (draggedPart) {
                const distMoved = pointerDownPos.distanceTo(new THREE.Vector2(event.clientX, event.clientY));
                if (isDraggingPart) {
                    playClickSound();
                    displayPartDetails(draggedPart.userData);
                } else if (distMoved <= 6 && draggedPart.userData && draggedPart.userData.nameVi) {
                    // Click without dragging
                    playClickSound();
                    displayPartDetails(draggedPart.userData);
                }
            }

            isDraggingPart = false;
            draggedPart = null;
            controls.enabled = true; // Re-enable orbit controls
            document.body.style.cursor = 'auto';
        }

        function resetPartPositions() {
            playClickSound();
            if (!currentModelGroup) return;

            document.getElementById('explode-slider').value = 0;
            document.getElementById('explode-val-text').innerText = "0%";
            explosionRate = 0;

            interactiveParts.forEach(part => {
                if (part.userData && part.userData.basePos) {
                    new TWEEN.Tween(part.position)
                        .to(part.userData.basePos, 450)
                        .easing(TWEEN.Easing.Back.Out)
                        .start();
                }
            });
        }

        function displayPartDetails(data) {
            document.getElementById('part-name-vi').innerText = data.nameVi;
            document.getElementById('part-name-en').innerText = data.nameEn;
            document.getElementById('part-material-spec').innerText = data.spec;
            document.getElementById('part-description').innerText = data.desc;

            const panel = document.getElementById('part-detail-panel');
            panel.classList.remove('translate-x-[120%]');
        }

        function closePartDetail() {
            document.getElementById('part-detail-panel').classList.add('translate-x-[120%]');
        }

        function focusOnPart() {
            playClickSound();
            new TWEEN.Tween(camera.position)
                .to({ x: 2.2, y: 1.2, z: 2.2 }, 800)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        }

        function clearSearch() {
            document.getElementById('search-input').value = "";
            document.getElementById('model-select').selectedIndex = 0;
            loadSelectedModel('kettle');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();

            // Real-time animation physics
            if (isSimulationRunning && currentModelGroup) {
                currentModelGroup.traverse(child => {
                    if (child.name === 'fan_blades_rotate' || child.name === 'pc_gpu_fan' || child.name === 'jet_fan_rotate') {
                        child.rotation.z += 0.3;
                    }
                    if (child.name === 'hdd_platter_rotate') {
                        child.rotation.y += 0.4;
                    }
                    if (child.name === 'ac_blower_rotate') {
                        child.rotation.x += 0.25;
                    }
                });

                // Update kettle live temperature screen simulation
                const mockTemp = Math.floor(80 + Math.sin(Date.now() * 0.003) * 20);
                updateDisplayTexture("HEATING...", `${mockTemp}.0 °C BOIL`);
            }

            renderer.render(scene, camera);
        }

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            initEngine();

            document.getElementById('explode-slider').addEventListener('input', (e) => {
                updateExplosion(parseFloat(e.target.value) / 100);
            });

            document.getElementById('model-select').addEventListener('change', (e) => {
                loadSelectedModel(e.target.value);
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) return;

                for (const key in MODELS_DATABASE) {
                    const m = MODELS_DATABASE[key];
                    if (m.nameVi.toLowerCase().includes(query) || m.nameEn.toLowerCase().includes(query)) {
                        document.getElementById('model-select').value = key;
                        loadSelectedModel(key);
                        break;
                    }
                }
            });
        });
    </script>
</body>
</html>
